listen: ":8080"
admin_listen: ":9090"
log_level: "info"
log_format: "json"
strategy: "round_robin"

backends:
  - url: "http://fakebackend-1:8081"
    weight: 1
  - url: "http://fakebackend-2:8082"
    weight: 1
  - url: "http://fakebackend-3:8083"
    weight: 1

health:
  path: "/health"
  interval: "10s"
  timeout: "2s"
  healthy_threshold: 2
  unhealthy_threshold: 2

proxy:
  max_idle_conns: 100
  max_idle_conns_per_host: 50
  idle_conn_timeout: "90s"
  response_header_timeout: "10s"
  tls_handshake_timeout: "10s"
  dial_timeout: "5s"
  request_timeout: "30s"
  retry_max_attempts: 2
  retry_backoff: "100ms"
  circuit_failure_threshold: 5
  circuit_cooldown: "30s"

rate_limit:
  enabled: true
  rate: 100
  burst: 200
  window: "1m"
  trusted_proxy: false

shutdown:
  grace_period: "15s"
